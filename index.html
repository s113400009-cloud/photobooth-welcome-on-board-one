<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓式拍貼機 Photo Booth</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
      /* 拿掉原本固定的 transform 鏡像，改用 JavaScript 動態控制 */
    }
    #countdown {
      font-size: 48px;
      font-weight: bold;
      color: #ff4757;
      height: 60px;
      margin: 10px 0;
    }
    
    /* 按鈕排版區 */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 15px; /* 按鈕之間的距離 */
      margin-top: 10px;
    }
    
    button {
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 25px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
    }
    
    #start-btn { background-color: #ff4757; }
    #switch-cam-btn { background-color: #3498db; } /* 切換按鈕用藍色區分 */

    #result-container {
      display: none;
      margin-top: 20px;
    }
    #output-img {
      width: 100%;
      max-width: 300px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📸 生日拍貼機</h1>
  
  <video id="webcam" autoplay playsinline muted></video>
  
  <div id="countdown"></div>
  
  <!-- 將兩個按鈕包裝在一起 -->
  <div class="button-group">
    <button id="switch-cam-btn" onclick="switchCamera()">🔄 切換鏡頭</button>
    <button id="start-btn" onclick="startPhotoShoot()">開始拍照</button>
  </div>

  <div id="result-container">
    <h2>🎉 完成囉！</h2>
    <p style="color: #666; font-size: 14px;">（提示：手機可長按下方圖片直接儲存）</p>
    
    <img id="output-img" alt="拍貼合成結果">
    <br><br>

    <a id="download-btn" target="_blank">
      <button type="button" style="background-color: #2ed573;">下載照片</button>
    </a>
  </div>
</div>

<canvas id="composite-canvas" style="display: none;"></canvas>

<script>
  const video = document.getElementById('webcam');
  const startBtn = document.getElementById('start-btn');
  const switchBtn = document.getElementById('switch-cam-btn');
  const countdownEl = document.getElementById('countdown');
  const resultContainer = document.getElementById('result-container');
  const outputImg = document.getElementById('output-img');
  const downloadBtn = document.getElementById('download-btn');
  const canvas = document.getElementById('composite-canvas');
  const ctx = canvas.getContext('2d');

  let photos = [];
  
  // 記錄當前的鏡頭模式，預設為前鏡頭 (user)
  let currentFacingMode = "user";

  const templateImg = new Image();
  templateImg.src = 'template.png';
  templateImg.onerror = () => {
    alert("⚠️ 錯誤：找不到 template.png！請檢查檔名與大小寫是否正確。");
  };

  // 1. 初始化相機（增加硬體釋放緩衝時間與詳細錯誤診斷）
  async function initCamera() {
    // 確保徹底關閉與釋放上一組相機串流
    if (video.srcObject) {
      const tracks = video.srcObject.getTracks();
      tracks.forEach(track => track.stop());
      video.srcObject = null;
      // 給予手機硬體 200ms 緩衝時間徹底釋放相機資源
      await wait(200);
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: currentFacingMode, 
          width: { ideal: 1280 }, 
          height: { ideal: 720 } 
        },
        audio: false
      });

      video.srcObject = stream;
      
      // 前鏡頭畫面左右翻轉；後鏡頭保持正常
      if (currentFacingMode === "user") {
        video.style.transform = "scaleX(-1)";
      } else {
        video.style.transform = "scaleX(1)";
      }

      // 明確觸發播放
      await video.play();

    } catch (err) {
      console.error("相機讀取詳細錯誤：", err);
      
      // 根據手機返回的具體錯誤原因跳出精確提示
      if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
        alert("⚠️ 相機無法讀取！請檢查：\n1. 手電筒是否開啟中？\n2. 背景是否有 LINE、IG 等 App 佔用相機？\n3. 手機是否開啟了「省電模式」？");
      } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        alert("⚠️ 存取被拒絕，請至手機設定允許瀏覽器使用相機權限。");
      } else {
        alert(`⚠️ 無法讀取相機 (${err.name})，請確認是否使用 https:// 網址開啟。`);
      }
    }
  }
  
  // 網頁載入時啟動
  initCamera();

  // 切換鏡頭功能
  function switchCamera() {
    switchBtn.disabled = true;
    
    if (currentFacingMode === "user") {
      currentFacingMode = "environment";
    } else {
      currentFacingMode = "user";
    }
    
    initCamera().then(() => {
      switchBtn.disabled = false;
    });
  }

  // 2. 開始連拍主流程
  async function startPhotoShoot() {
    photos = [];
    startBtn.disabled = true;
    switchBtn.disabled = true; // 拍照時不允許切換鏡頭
    resultContainer.style.display = "none";

    for (let i = 0; i < 3; i++) {
      await countdown(8);
      
      countdownEl.innerText = "📸 咔嚓！";
      takeAndSaveSnap();
      
      await wait(800);
    }

    countdownEl.innerText = "";

    if (photos.length === 3) {
      await createPhoto();
    } else {
      alert(`拍照失敗，只抓取到 ${photos.length} 張照片，請重新嘗試！`);
    }

    startBtn.disabled = false;
    switchBtn.disabled = false;
  }

  // 3. 倒數計時工具
  function countdown(seconds) {
    return new Promise(resolve => {
      let counter = seconds;
      countdownEl.innerText = counter;
      const interval = setInterval(() => {
        counter--;
        if (counter > 0) {
          countdownEl.innerText = counter;
        } else {
          clearInterval(interval);
          resolve();
        }
      }, 1000);
    });
  }

  // 4. 等待工具
  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // 5. 擷取畫面與暫存
  function takeAndSaveSnap() {
    const vWidth = video.videoWidth || video.clientWidth || 640;
    const vHeight = video.videoHeight || video.clientHeight || 480;

    const snapCanvas = document.createElement("canvas");
    snapCanvas.width = vWidth;
    snapCanvas.height = vHeight;
    const snapCtx = snapCanvas.getContext("2d");

    // 前鏡頭自拍時，左右翻轉擷取畫面
    if (currentFacingMode === "user") {
      snapCtx.translate(vWidth, 0);
      snapCtx.scale(-1, 1);
    }

    try {
      snapCtx.drawImage(video, 0, 0, vWidth, vHeight);
      photos.push(snapCanvas);
    } catch (e) {
      console.error("擷取相機畫面失敗：", e);
    }
  }

// 6. 合成邏輯（已更新：下預留 1.625）
  async function createPhoto() {
    if (!templateImg.complete) {
      await new Promise(resolve => templateImg.onload = resolve);
    }

    // 1. 設定 Canvas 總寬高
    canvas.width = templateImg.width || 600;
    canvas.height = templateImg.height || 1800; // 寬高比 2:6 (1:3)

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 2. 比例參數設定 (畫布總高 6)
    const totalH = 6;
    const topPadding = 1.046;    // 上預留 1.046
    const bottomPadding = 1.625; // 下預留 1.625
    
    // 照片之間的間距 (設定為 0.08，避免照片擠壓或重疊)
    const photoGap = 0.08; 
    
    // 扣除上下預留區與 2 個間距後，算出「單張照片的真實高度」
    const availableH = totalH - topPadding - bottomPadding - (photoGap * 2); 
    const singlePhotoH = availableH / 3; // 單張照片高度 (約 1.056)

    // 3. 轉為 Canvas 像素座標與比例
    const pX = canvas.width * 0.0592;
    const pW = canvas.width * 0.8815;
    const pH = canvas.height * (singlePhotoH / totalH);

    // 4. 精確計算 3 張照片的起始 Y 座標
    const y1 = canvas.height * (topPadding / totalH);
    const y2 = canvas.height * ((topPadding + singlePhotoH + photoGap) / totalH);
    const y3 = canvas.height * ((topPadding + (singlePhotoH + photoGap) * 2) / totalH);

    const slots = [
      { x: pX, y: y1, w: pW, h: pH },
      { x: pX, y: y2, w: pW, h: pH },
      { x: pX, y: y3, w: pW, h: pH }
    ];

    // 5. 先繪製背景模板圖
    ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);

    // 6. 依序繪製三張照片
    slots.forEach((slot, index) => {
      const savedPhotoCanvas = photos[index];
      if (savedPhotoCanvas) {
        drawCoverImage(ctx, savedPhotoCanvas, slot.x, slot.y, slot.w, slot.h);
      }
    });

    const resultUrl = canvas.toDataURL("image/png");
    outputImg.src = resultUrl;
    downloadBtn.href = resultUrl;
    downloadBtn.download = "生日拍貼照.png"; 

    resultContainer.style.display = "block";
  }

  // 7. Cover 模式裁切
  function drawCoverImage(targetCtx, img, x, y, w, h) {
    const imgRatio = img.width / img.height;
    const targetRatio = w / h;
    let sx, sy, sw, sh;

    if (imgRatio > targetRatio) {
      sh = img.height;
      sw = img.height * targetRatio;
      sx = (img.width - sw) / 2;
      sy = 0;
    } else {
      sw = img.width;
      sh = img.width / targetRatio;
      sx = 0;
      sy = (img.height - sh) / 2;
    }

    targetCtx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }
</script>

</body>
</html>
