<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓式拍貼機 Photo Booth</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    video {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #000;
    }
    
    #countdown {
      font-size: 48px;
      font-weight: bold;
      color: #ff4757;
      height: 60px;
      margin: 10px 0;
    }
    
    .button-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }
    
    button {
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 25px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
    }
    
    #start-btn { background-color: #ff4757; }
    #switch-cam-btn { background-color: #3498db; }

    #result-container {
      display: none;
      margin-top: 20px;
    }
    #output-img {
      width: 100%;
      max-width: 300px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📸 生日拍貼機</h1>
  
  <video id="webcam" autoplay playsinline muted></video>
  
  <div id="countdown"></div>
  
  <div class="button-group">
    <button id="switch-cam-btn" onclick="switchCamera()">🔄 切換鏡頭</button>
    <button id="start-btn" onclick="startPhotoShoot()">開始拍照</button>
  </div>

  <div id="result-container">
    <h2>🎉 完成囉！</h2>
    <p style="color: #666; font-size: 14px;">（提示：手機可長按下方圖片直接儲存）</p>
    
    <img id="output-img" alt="拍貼合成結果">
    <br><br>

    <a id="download-btn" target="_blank">
      <button type="button" style="background-color: #2ed573;">下載照片</button>
    </a>
  </div>
</div>

<canvas id="composite-canvas" style="display: none;"></canvas>

<script>
  const video = document.getElementById('webcam');
  const startBtn = document.getElementById('start-btn');
  const switchBtn = document.getElementById('switch-cam-btn');
  const countdownEl = document.getElementById('countdown');
  const resultContainer = document.getElementById('result-container');
  const outputImg = document.getElementById('output-img');
  const downloadBtn = document.getElementById('download-btn');
  const canvas = document.getElementById('composite-canvas');
  const ctx = canvas.getContext('2d');

  let photos = [];
  let currentFacingMode = "user";

  const templateImg = new Image();
  templateImg.src = 'template.png';
  templateImg.onerror = () => {
    alert("⚠️ 錯誤：找不到 template.png！請檢查檔名與大小寫是否正確。");
  };

  // 1. 初始化相機
  async function initCamera() {
    if (video.srcObject) {
      const tracks = video.srcObject.getTracks();
      tracks.forEach(track => track.stop());
      video.srcObject = null;
      await wait(200);
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: currentFacingMode, 
          width: { ideal: 1280 }, 
          height: { ideal: 960 }
        },
        audio: false
      });

      video.srcObject = stream;
      
      if (currentFacingMode === "user") {
        video.style.transform = "scaleX(-1)";
      } else {
        video.style.transform = "scaleX(1)";
      }

      await video.play();

    } catch (err) {
      console.error("相機讀取詳細錯誤：", err);
      
      if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
        alert("⚠️ 相機無法讀取！請檢查：\n1. 手電筒是否開啟中？\n2. 背景是否有 LINE、IG 等 App 佔用相機？\n3. 手機是否開啟了「省電模式」？");
      } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        alert("⚠️ 存取被拒絕，請至手機設定允許瀏覽器使用相機權限。");
      } else {
        alert(`⚠️ 無法讀取相機 (${err.name})，請確認是否使用 https:// 網址開啟。`);
      }
    }
  }
  
  initCamera();

  // 切換鏡頭功能
  function switchCamera() {
    switchBtn.disabled = true;
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    
    initCamera().then(() => {
      switchBtn.disabled = false;
    });
  }

  // 2. 開始連拍主流程（三張照片連拍）
  async function startPhotoShoot() {
    photos = [];
    startBtn.disabled = true;
    switchBtn.disabled = true;
    resultContainer.style.display = "none";

    for (let i = 0; i < 3; i++) {
      await countdown(8);
      
      countdownEl.innerText = "📸 咔嚓！";
      takeAndSaveSnap();
      
      await wait(800);
    }

    countdownEl.innerText = "";

    if (photos.length === 3) {
      await createPhoto();
    } else {
      alert(`拍照失敗，只抓取到 ${photos.length} 張照片，請重新嘗試！`);
    }

    startBtn.disabled = false;
    switchBtn.disabled = false;
  }

  // 3. 倒數計時工具
  function countdown(seconds) {
    return new Promise(resolve => {
      let counter = seconds;
      countdownEl.innerText = counter;
      const interval = setInterval(() => {
        counter--;
        if (counter > 0) {
          countdownEl.innerText = counter;
        } else {
          clearInterval(interval);
          resolve();
        }
      }, 1000);
    });
  }

  // 4. 等待工具
  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // 5. 擷取畫面與暫存
  function takeAndSaveSnap() {
    const vWidth = video.videoWidth || 640;
    const vHeight = video.videoHeight || 480;

    const snapCanvas = document.createElement("canvas");
    snapCanvas.width = vWidth;
    snapCanvas.height = vHeight;
    const snapCtx = snapCanvas.getContext("2d");

    if (currentFacingMode === "user") {
      snapCtx.translate(vWidth, 0);
      snapCtx.scale(-1, 1);
    }

    try {
      snapCtx.drawImage(video, 0, 0, vWidth, vHeight);
      photos.push(snapCanvas);
    } catch (e) {
      console.error("擷取相機畫面失敗：", e);
    }
  }

  // 6. 合成邏輯
  async function createPhoto() {
    if (!templateImg.complete) {
      await new Promise(resolve => templateImg.onload = resolve);
    }

    canvas.width = templateImg.width || 600;
    canvas.height = templateImg.height || 1800;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const pX = canvas.width * 0.0592;
    const pW = canvas.width * 0.8815;
    const pH = pW * (3 / 4); // 維持 4:3 比例

    const slots = [
      { x: pX, y: canvas.height * 0.15, w: pW, h: pH },
      { x: pX, y: canvas.height * 0.40, w: pW, h: pH },
      { x: pX, y: canvas.height * 0.65, w: pW, h: pH }
    ];

    // 先繪製照片，完全不裁剪直接畫入
    slots.forEach((slot, index) => {
      const savedPhotoCanvas = photos[index];
      if (savedPhotoCanvas) {
        ctx.drawImage(savedPhotoCanvas, 0, 0, savedPhotoCanvas.width, savedPhotoCanvas.height, slot.x, slot.y, slot.w, slot.h);
      }
    });

    // 最後蓋上模板外框
    ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);

    const resultUrl = canvas.toDataURL("image/png");
    outputImg.src = resultUrl;
    downloadBtn.href = resultUrl;
    downloadBtn.download = "生日拍貼照.png"; 

    resultContainer.style.display = "block";
  }
</script>

</body>
</html>
